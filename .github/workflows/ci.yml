name: ZION CI
# Production validation is required before the main branch is considered green.
# Final CI contract verified by GitHub Actions.
# Production CI trigger checkpoint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: zion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Smoke test serverless API bootstrap
        run: node apps/api/scripts/smoke-serverless.cjs

      - name: Run API tests
        run: pnpm --filter api exec jest --runInBand

  web:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-validation-key
      NEXT_PUBLIC_ZION_API_URL: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter web build

      - name: Validate offline i18n catalogs
        run: node apps/web/scripts/check-i18n-catalogs.mjs

  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate migration names
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"
          names="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)"
          timestamped_names="$(printf '%s\n' "$names" | grep -E '^[0-9]{14}_' || true)"
          duplicate_versions="$(printf '%s\n' "$timestamped_names" | cut -c1-14 | sort | uniq -d)"
          if [[ -n "$duplicate_versions" ]]; then
            echo "Duplicate 14-digit migration timestamps:" >&2
            printf '%s\n' "$duplicate_versions" >&2
            exit 1
          fi
          printf '%s\n' "$names"

      - name: Generate and validate read-only Frame migration manifest
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/scripts/frame-migration-manifest.cjs > "$RUNNER_TEMP/frame-migration-manifest.json"
          node - "$RUNNER_TEMP/frame-migration-manifest.json" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.mode !== 'read-only' ||
              !Number.isInteger(manifest.count) ||
              manifest.count < 1 ||
              manifest.count !== manifest.migrations.length) {
            throw new Error('Frame manifest has an invalid envelope');
          }
          const versions = new Set();
          for (const item of manifest.migrations) {
            if (!/^\d{14}_.+\.sql$/.test(item.name) ||
                item.version !== item.name.slice(0, 14) ||
                !/^[a-f0-9]{64}$/.test(item.sha256) ||
                !Number.isInteger(item.bytes) || item.bytes < 0 ||
                versions.has(item.version)) {
              throw new Error('Frame manifest contains an invalid or duplicate migration entry');
            }
            versions.add(item.version);
          }
          console.log('Frame manifest validated:', manifest.count, 'migrations; no database access performed.');
          NODE
          node --test apps/api/scripts/frame-migration-manifest.test.cjs

      - name: Check whitespace
        run: git diff --check
