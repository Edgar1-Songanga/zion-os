name: ZION CI
# Production validation is required before the main branch is considered green.
# Final CI contract verified by GitHub Actions.
# Production CI trigger checkpoint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: zion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Smoke test serverless API bootstrap
        run: node apps/api/scripts/smoke-serverless.cjs

      - name: Run API unit tests
        run: pnpm --filter api exec jest --runInBand

      - name: Run API HTTP smoke E2E
        run: pnpm --filter api test:e2e --runInBand

  web:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-validation-key
      NEXT_PUBLIC_ZION_API_URL: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test local receipt QR generator
        run: node apps/web/scripts/test-receipt-qr.cjs

      - name: Build Web
        run: pnpm --filter web build

      - name: Validate offline i18n catalogs
        run: node apps/web/scripts/check-i18n-catalogs.mjs

  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test RESA push privacy presentation contract
        run: node --test supabase/functions/resa-push-delivery/presentation.test.cjs

      - name: Validate migration names
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"
          names="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)"
          timestamped_names="$(printf '%s\n' "$names" | grep -E '^[0-9]{14}_' || true)"
          duplicate_versions="$(printf '%s\n' "$timestamped_names" | cut -c1-14 | sort | uniq -d)"
          if [[ -n "$duplicate_versions" ]]; then
            echo "Duplicate 14-digit migration timestamps:" >&2
            printf '%s\n' "$duplicate_versions" >&2
            exit 1
          fi
          printf '%s\n' "$names"

      - name: Generate and validate read-only Frame migration manifest
        run: node apps/api/scripts/frame-migration-manifest.cjs > /tmp/frame-migration-manifest.json

      - name: Test Frame migration manifest
        run: node --test apps/api/scripts/frame-migration-manifest.test.cjs

      - name: Test target-bound Frame production plan
        run: node --test apps/api/scripts/frame-production-plan.test.cjs

      - name: Start disposable PostgreSQL for Frame audit guard
        run: |
          docker run --rm -d --name zion-frame-audit-postgres \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            if docker exec zion-frame-audit-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Verify Frame audit log is append-only
        run: |
          set -euo pipefail
          docker exec -i zion-frame-audit-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/frame_audit_append_only_fixture.sql
          docker exec -i zion-frame-audit-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261110170000_frame_audit_append_only.sql
          docker exec -i zion-frame-audit-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/frame_audit_append_only_regression.sql

      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f zion-frame-audit-postgres || true

      - name: Check whitespace
        run: git diff --check
