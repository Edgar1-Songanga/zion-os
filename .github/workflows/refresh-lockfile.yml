name: Refresh pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "services/*/package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zion-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            pnpm install --lockfile-only

            if git diff --quiet -- pnpm-lock.yaml; then
              echo "Lockfile already synchronized after refreshing from main."
              exit 0
            fi

            git add pnpm-lock.yaml
            git commit -m "chore: synchronize pnpm lockfile" || true

            if git push origin HEAD:main; then
              echo "Lockfile synchronized on attempt $attempt."
              exit 0
            fi

            git reset --hard origin/main
            sleep 2
          done

          echo "Unable to publish the synchronized lockfile after 3 attempts."
          exit 1
