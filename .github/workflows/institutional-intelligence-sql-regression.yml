name: Institutional intelligence SQL regression

on:
  push:
    paths:
      - 'supabase/migrations/20261123170000_institutional_intelligence_aggregation.sql'
      - 'supabase/tests/institutional_intelligence_fixture.sql'
      - 'supabase/tests/institutional_intelligence_regression.sql'
      - '.github/workflows/institutional-intelligence-sql-regression.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261123170000_institutional_intelligence_aggregation.sql'
      - 'supabase/tests/institutional_intelligence_fixture.sql'
      - 'supabase/tests/institutional_intelligence_regression.sql'
      - '.github/workflows/institutional-intelligence-sql-regression.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated institutional intelligence schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d zion_test -v ON_ERROR_STOP=1 -f supabase/tests/institutional_intelligence_fixture.sql
      - name: Apply institutional intelligence migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d zion_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261123170000_institutional_intelligence_aggregation.sql
      - name: Verify authorization, aggregation, privacy and audit
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d zion_test -v ON_ERROR_STOP=1 -f supabase/tests/institutional_intelligence_regression.sql
