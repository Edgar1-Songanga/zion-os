name: Spiritual growth SQL regression
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/spiritual-growth-sql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prayer-trigger-regression:
    name: PostgreSQL prayer trigger regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zion_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/spiritual-growth-trigger-fixture.sql
      - name: Apply original trigger migration to fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006170000_spiritual_growth_event_integration.sql
      - name: Match currently deployed hardened trigger definitions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/spiritual-growth-production-function-state.sql
      - name: Apply forward-only partial-index correction
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017170000_fix_spiritual_growth_partial_conflict_target.sql
      - name: Apply optional created_at correction
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017180000_fix_spiritual_devotion_optional_created_at.sql
      - name: Verify prayer, answer, devotion and idempotency
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/spiritual-growth-trigger-regression.sql
  spiritual-chat-rls-initplan:
    name: PostgreSQL spiritual chat RLS initplan regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zion_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated auth and public schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/spiritual-chat-rls-fixture.sql
      - name: Apply spiritual chat base schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106104948_spiritual_chat_persistence.sql
      - name: Apply statement-level auth lookup optimization
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110050104_spiritual_chat_rls_initplan_optimization.sql
      - name: Verify owner isolation and optimized policies
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/spiritual-chat-rls-regression.sql
  ministries-duplicate-index:
    name: PostgreSQL ministries duplicate index regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zion_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ministries and composite foreign keys
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/ministries-duplicate-index-fixture.sql
      - name: Remove redundant unique index
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110052000_remove_duplicate_ministries_index.sql
      - name: Verify the constraint-backed index and foreign keys remain valid
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ministries-duplicate-index-regression.sql
