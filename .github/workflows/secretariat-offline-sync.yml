name: Secretariat offline sync regression

on:
  pull_request:
    paths:
      - "supabase/migrations/*secretariat_offline_sync*"
      - "supabase/tests/secretariat_offline_sync*"
      - ".github/workflows/secretariat-offline-sync.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*secretariat_offline_sync*"
      - "supabase/tests/secretariat_offline_sync*"
      - ".github/workflows/secretariat-offline-sync.yml"

permissions:
  contents: read

jobs:
  secretariat-offline-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL
        run: |
          docker run --rm -d --name zion-secretariat-offline-postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            if docker exec zion-secretariat-offline-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Prepare isolated member fixture
        run: docker exec -i zion-secretariat-offline-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/secretariat_offline_sync_fixture.sql
      - name: Apply Secretariat offline sync migration
        run: docker exec -i zion-secretariat-offline-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261112200000_secretariat_offline_sync.sql
      - name: Verify idempotency and optimistic concurrency
        run: docker exec -i zion-secretariat-offline-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/secretariat_offline_sync_regression.sql
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f zion-secretariat-offline-postgres || true
