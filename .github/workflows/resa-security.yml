name: RESA security regressions

on:
  pull_request:
    paths:
      - "supabase/migrations/*resa*"
      - "supabase/migrations/*department*"
      - "supabase/tests/resa_security*"
      - "supabase/tests/resa_account_level_enforcement_regression.sql"
      - "supabase/tests/resa_call_security*"
      - "supabase/tests/resa_member_privacy_regression.sql"
      - "supabase/tests/resa_four_level_profile_visibility.sql"
      - "supabase/tests/resa_content_audience_visibility_regression.sql"
      - "supabase/tests/resa_media_visibility_regression.sql"
      - "supabase/tests/resa_event_community_audience_regression.sql"
      - "supabase/tests/resa_user_blocking_regression.sql"
      - "supabase/tests/resa_engagement_aggregate_regression.sql"
      - "supabase/tests/resa_story_view_tracking_regression.sql"
      - "supabase/tests/resa_security_fixture.sql"
      - ".github/workflows/resa-security.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*resa*"
      - "supabase/migrations/*department*"
      - "supabase/tests/resa_security*"
      - "supabase/tests/resa_call_security*"
      - "supabase/tests/resa_story_view_tracking_regression.sql"
      - ".github/workflows/resa-security.yml"

permissions:
  contents: read

jobs:
  private-live-and-department-purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL
        run: |
          docker run --rm -d --name zion-resa-security-postgres \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            if docker exec zion-resa-security-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Prepare isolated RESA and department fixture
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_security_fixture.sql
      - name: Apply password and purge-scope hardening
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106220330_resa_password_bruteforce_and_department_purge_scope.sql
      - name: Apply profile discovery privacy hardening
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106220334_resa_profile_search_privacy_hardening.sql
      - name: Verify lockout, profile privacy, authorization scope and grants
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_security_regression.sql
      - name: Apply call lifecycle security hardening
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107073931_resa_call_lifecycle_security.sql
      - name: Apply server-side unanswered-call expiry
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107082037_resa_server_call_expiry.sql
      - name: Verify call identity, lifecycle, participants and signaling boundaries
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_call_security_regression.sql
      - name: Apply RESA member profile and contact privacy
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108111206_resa_member_contact_privacy.sql
      - name: Harden direct-message trigger search path
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108111255_harden_resa_message_trigger_search_path.sql
      - name: Verify profile, message, call, follow and group-invite privacy
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_member_privacy_regression.sql
      - name: Apply content audience visibility RLS
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108121500_resa_content_audience_visibility.sql
      - name: Verify public, followers, community, organization and private content access
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_content_audience_visibility_regression.sql
      - name: Apply public-bucket media visibility guard
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108123000_resa_public_bucket_media_visibility_guard.sql
      - name: Verify non-public posts cannot reference public media
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_media_visibility_regression.sql
      - name: Apply event and community audience access policies
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108124500_resa_event_and_community_audience_access.sql
      - name: Apply community membership reactivation hardening
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108130500_resa_community_membership_reactivation_hardening.sql
      - name: Apply private community member visibility
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108131000_resa_private_community_member_visibility.sql
      - name: Apply community RLS recursion guard
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108131500_resa_community_rls_recursion_guard.sql
      - name: Verify event and community access boundaries
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_event_community_audience_regression.sql
      - name: Apply RESA user blocking safety
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108133000_resa_user_blocking_safety.sql
      - name: Apply four-level profile visibility
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108130000_resa_four_level_profile_visibility.sql
      - name: Apply block-aware profile visibility
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108134500_resa_blocked_profile_visibility.sql
      - name: Verify RESA user blocking and interaction boundaries
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_user_blocking_regression.sql
      - name: Apply privacy-scoped engagement aggregates
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108135000_resa_content_engagement_aggregates.sql
      - name: Verify engagement aggregate privacy boundaries
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_engagement_aggregate_regression.sql
      - name: Verify public, friends, friends-of-friends and private visibility
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_four_level_profile_visibility.sql
      - name: Apply secure RESA story view tracking
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108143000_resa_story_view_tracking.sql
      - name: Verify story view deduplication, audience, expiry, blocking and author-only reads
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_story_view_tracking_regression.sql
      # Exercise the private recording bucket, RLS and owner-path policy in the isolated PostgreSQL fixture.
      - name: Apply private RESA Live recording storage foundation
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108172000_resa_live_recording_foundation.sql
      - name: Verify private RESA Live recording metadata and storage ownership
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_live_recording_foundation_regression.sql
      - name: Apply RESA account mute controls
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108183000_resa_user_mutes.sql
      - name: Apply RESA notification preference enforcement
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108184000_resa_notification_preferences_enforcement.sql
      - name: Apply mute-aware RESA profile search
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108190000_resa_mute_profile_search.sql
      - name: Apply RESA global moderation permissions
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108191000_resa_global_moderation_permissions.sql
      - name: Verify RESA account mute isolation and notification suppression
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_user_mutes_regression.sql
      - name: Verify RESA notification preference enforcement
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_notification_preferences_regression.sql
      - name: Verify global moderation queue and decision access
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_global_moderation_regression.sql
      - name: Apply RESA report outcome appeals
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108192000_resa_moderation_report_appeals.sql
      - name: Verify RESA report appeal ownership and second-reviewer isolation
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_moderation_appeals_regression.sql
      - name: Apply RESA content sanctions and author appeals
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108200000_resa_content_enforcement_appeals.sql
      - name: Verify RESA content sanctions, visibility and independent appeals
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_content_enforcement_appeals_regression.sql
      - name: Apply RESA account-level sanctions and independent appeals
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108210000_resa_account_level_enforcement.sql
      - name: Verify RESA account restriction enforcement and independent appeals
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_account_level_enforcement_regression.sql
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f zion-resa-security-postgres || true
