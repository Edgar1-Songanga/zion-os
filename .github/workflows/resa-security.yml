name: RESA security regressions

on:
  pull_request:
    paths:
      - "supabase/migrations/*resa*"
      - "supabase/migrations/*department*"
      - "supabase/tests/resa_security*"
      - "supabase/tests/resa_call_security*"
      - "supabase/tests/resa_member_privacy_regression.sql"
      - "supabase/tests/resa_four_level_profile_visibility.sql"
      - "supabase/tests/resa_content_audience_visibility_regression.sql"
      - "supabase/tests/resa_media_visibility_regression.sql"
      - "supabase/tests/resa_event_community_audience_regression.sql"
      - "supabase/tests/resa_security_fixture.sql"
      - ".github/workflows/resa-security.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*resa*"
      - "supabase/migrations/*department*"
      - "supabase/tests/resa_security*"
      - "supabase/tests/resa_call_security*"
      - ".github/workflows/resa-security.yml"

permissions:
  contents: read

jobs:
  private-live-and-department-purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL
        run: |
          docker run --rm -d --name zion-resa-security-postgres \
            -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            if docker exec zion-resa-security-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Prepare isolated RESA and department fixture
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_security_fixture.sql
      - name: Apply password and purge-scope hardening
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106220330_resa_password_bruteforce_and_department_purge_scope.sql
      - name: Apply profile discovery privacy hardening
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106220334_resa_profile_search_privacy_hardening.sql
      - name: Verify lockout, profile privacy, authorization scope and grants
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_security_regression.sql
      - name: Apply call lifecycle security hardening
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107073931_resa_call_lifecycle_security.sql
      - name: Apply server-side unanswered-call expiry
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107082037_resa_server_call_expiry.sql
      - name: Verify call identity, lifecycle, participants and signaling boundaries
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_call_security_regression.sql
      - name: Apply RESA member profile and contact privacy
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108111206_resa_member_contact_privacy.sql
      - name: Harden direct-message trigger search path
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108111255_harden_resa_message_trigger_search_path.sql
      - name: Verify profile, message, call, follow and group-invite privacy
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_member_privacy_regression.sql
      - name: Apply content audience visibility RLS
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108121500_resa_content_audience_visibility.sql
      - name: Verify public, followers, community, organization and private content access
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_content_audience_visibility_regression.sql
      - name: Apply public-bucket media visibility guard
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108123000_resa_public_bucket_media_visibility_guard.sql
      - name: Verify non-public posts cannot reference public media
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_media_visibility_regression.sql
      - name: Apply event and community audience access policies
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108124500_resa_event_and_community_audience_access.sql
      - name: Verify event and community access boundaries
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_event_community_audience_regression.sql
      - name: Apply four-level profile visibility
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261108130000_resa_four_level_profile_visibility.sql
      - name: Verify public, friends, friends-of-friends and private visibility
        run: |
          docker exec -i zion-resa-security-postgres psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/resa_four_level_profile_visibility.sql
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f zion-resa-security-postgres || true
