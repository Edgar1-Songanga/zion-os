name: OCI Always Free container build validation

on:
  pull_request:
    paths:
      - "apps/web/next.config.ts"
      - "apps/web/Dockerfile"
      - "apps/api/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/oci-container-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/next.config.ts"
      - "apps/web/Dockerfile"
      - "apps/api/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/oci-container-build.yml"

permissions:
  contents: read

concurrency:
  group: oci-container-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build Next.js standalone image (AMD64 + ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-build-only-key
            NEXT_PUBLIC_ZION_API_URL=https://example.invalid/api

  api:
    name: Build NestJS runtime image (AMD64 + ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
