name: Generate RESA authorization migration scaffold

on:
  push:
    branches:
      - security/resa-authz-hardening
    paths:
      - ".github/workflows/generate-resa-authz-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/resa-authz-hardening
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3.2.0
        with:
          version: 2.122.1

      - name: Generate migration using Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new resa_authorization_hardening
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_resa_authorization_hardening.sql' -print -quit)"
          test -n "$generated"
          git add "$generated"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(db): generate RESA authorization migration scaffold"
          git push origin HEAD:security/resa-authz-hardening
